services:
  - type: web
    name: jd-assistant-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false                      # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app  # update after Vercel deploy
