<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="frontendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="ragGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/>
    </marker>

    <!-- Glow filters -->
    <filter id="glowPurple">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" fill="url(#bgGrad)" rx="16"/>

  <!-- Grid dots background -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#334155" opacity="0.5"/>
  </pattern>
  <rect width="900" height="580" fill="url(#dots)" rx="16"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="700" letter-spacing="1">JD Assistant — Architecture</text>
  <text x="450" y="56" text-anchor="middle" fill="#64748b" font-size="11">Gemini RAG · FastAPI · React</text>

  <!-- ═══ FRONTEND BOX ═══ -->
  <rect x="30" y="75" width="210" height="420" rx="12" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5" opacity="0.9"/>
  <rect x="30" y="75" width="210" height="36" rx="12" fill="url(#frontendGrad)" opacity="0.9"/>
  <rect x="30" y="99" width="210" height="12" fill="url(#frontendGrad)" opacity="0.9"/>
  <text x="135" y="99" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">⚛  React Frontend</text>
  <text x="135" y="112" text-anchor="middle" fill="#c4b5fd" font-size="9">Vite · TypeScript · :5173</text>

  <!-- Frontend components -->
  <rect x="48" y="125" width="174" height="32" rx="7" fill="#312e81" stroke="#6d28d9" stroke-width="1"/>
  <text x="80" y="138" fill="#a78bfa" font-size="10" font-weight="600">📄</text>
  <text x="93" y="138" fill="#e2e8f0" font-size="10" font-weight="600">JD Input</text>
  <text x="93" y="149" fill="#64748b" font-size="8">Paste + Analyse JD</text>

  <rect x="48" y="165" width="174" height="32" rx="7" fill="#312e81" stroke="#6d28d9" stroke-width="1"/>
  <text x="80" y="178" fill="#a78bfa" font-size="10" font-weight="600">💬</text>
  <text x="93" y="178" fill="#e2e8f0" font-size="10" font-weight="600">Chat Q&amp;A</text>
  <text x="93" y="189" fill="#64748b" font-size="8">Grounded answers</text>

  <rect x="48" y="205" width="174" height="32" rx="7" fill="#312e81" stroke="#6d28d9" stroke-width="1"/>
  <text x="80" y="218" fill="#a78bfa" font-size="10" font-weight="600">📋</text>
  <text x="93" y="218" fill="#e2e8f0" font-size="10" font-weight="600">Interview Prep</text>
  <text x="93" y="229" fill="#64748b" font-size="8">3-category questions</text>

  <rect x="48" y="245" width="174" height="32" rx="7" fill="#312e81" stroke="#6d28d9" stroke-width="1"/>
  <text x="80" y="258" fill="#a78bfa" font-size="10" font-weight="600">⚠️</text>
  <text x="93" y="258" fill="#e2e8f0" font-size="10" font-weight="600">Weak Spots</text>
  <text x="93" y="269" fill="#64748b" font-size="8">Resume PDF/DOCX upload</text>

  <rect x="48" y="285" width="174" height="32" rx="7" fill="#312e81" stroke="#6d28d9" stroke-width="1"/>
  <text x="80" y="298" fill="#f97316" font-size="10" font-weight="600">🤖</text>
  <text x="93" y="298" fill="#e2e8f0" font-size="10" font-weight="600">Coach Bot</text>
  <text x="93" y="309" fill="#64748b" font-size="8">Floating interview advisor</text>

  <!-- Sidebar label -->
  <rect x="48" y="330" width="174" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="135" y="344" text-anchor="middle" fill="#475569" font-size="9">Sidebar Nav · Dashboard Layout</text>

  <!-- Port label -->
  <rect x="85" y="462" width="100" height="20" rx="10" fill="#312e81" stroke="#7c3aed" stroke-width="1"/>
  <text x="135" y="475" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">localhost:5173</text>

  <!-- ═══ BACKEND BOX ═══ -->
  <rect x="320" y="75" width="230" height="420" rx="12" fill="#0c1929" stroke="#0891b2" stroke-width="1.5" opacity="0.9"/>
  <rect x="320" y="75" width="230" height="36" rx="12" fill="url(#backendGrad)" opacity="0.9"/>
  <rect x="320" y="99" width="230" height="12" fill="url(#backendGrad)" opacity="0.9"/>
  <text x="435" y="99" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">⚡  FastAPI Backend</text>
  <text x="435" y="112" text-anchor="middle" fill="#a5f3fc" font-size="9">Python 3.12 · :8000</text>

  <!-- Endpoints -->
  <rect x="338" y="125" width="194" height="22" rx="5" fill="#082f49" stroke="#0891b2" stroke-width="1"/>
  <text x="360" y="139" fill="#22d3ee" font-size="9" font-weight="700">POST</text>
  <text x="398" y="139" fill="#e2e8f0" font-size="9">/api/ingest</text>

  <rect x="338" y="153" width="194" height="22" rx="5" fill="#082f49" stroke="#0891b2" stroke-width="1"/>
  <text x="360" y="167" fill="#22d3ee" font-size="9" font-weight="700">POST</text>
  <text x="398" y="167" fill="#e2e8f0" font-size="9">/api/ask</text>

  <rect x="338" y="181" width="194" height="22" rx="5" fill="#082f49" stroke="#0891b2" stroke-width="1"/>
  <text x="360" y="195" fill="#22d3ee" font-size="9" font-weight="700">POST</text>
  <text x="398" y="195" fill="#e2e8f0" font-size="9">/api/interview-prep</text>

  <rect x="338" y="209" width="194" height="22" rx="5" fill="#082f49" stroke="#0891b2" stroke-width="1"/>
  <text x="360" y="223" fill="#22d3ee" font-size="9" font-weight="700">POST</text>
  <text x="398" y="223" fill="#e2e8f0" font-size="9">/api/weak-spots</text>

  <rect x="338" y="237" width="194" height="22" rx="5" fill="#082f49" stroke="#0891b2" stroke-width="1"/>
  <text x="360" y="251" fill="#22d3ee" font-size="9" font-weight="700">POST</text>
  <text x="398" y="251" fill="#e2e8f0" font-size="9">/api/extract-resume</text>

  <rect x="338" y="265" width="194" height="22" rx="5" fill="#082f49" stroke="#0891b2" stroke-width="1"/>
  <text x="360" y="279" fill="#22d3ee" font-size="9" font-weight="700">POST</text>
  <text x="398" y="279" fill="#e2e8f0" font-size="9">/api/coach</text>

  <!-- RAG Pipeline box -->
  <rect x="338" y="300" width="194" height="150" rx="8" fill="#0a2818" stroke="#10b981" stroke-width="1.2"/>
  <text x="435" y="316" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700">RAG Pipeline</text>

  <text x="350" y="334" fill="#64748b" font-size="8">1.</text>
  <text x="360" y="334" fill="#94a3b8" font-size="8">chunk_text()  — 150w sliding window</text>
  <text x="350" y="349" fill="#64748b" font-size="8">2.</text>
  <text x="360" y="349" fill="#94a3b8" font-size="8">embed_documents()  — Gemini 768-dim</text>
  <text x="350" y="364" fill="#64748b" font-size="8">3.</text>
  <text x="360" y="364" fill="#94a3b8" font-size="8">VectorStore.add()  — numpy matrix</text>
  <text x="350" y="379" fill="#64748b" font-size="8">4.</text>
  <text x="360" y="379" fill="#94a3b8" font-size="8">embed_query()  — retrieval_query</text>
  <text x="350" y="394" fill="#64748b" font-size="8">5.</text>
  <text x="360" y="394" fill="#94a3b8" font-size="8">cosine similarity  — top-5 chunks</text>
  <text x="350" y="409" fill="#64748b" font-size="8">6.</text>
  <text x="360" y="409" fill="#94a3b8" font-size="8">LLM generate()  — grounded prompt</text>
  <text x="350" y="436" fill="#475569" font-size="7.5">In-memory · resets per session</text>

  <!-- Port label -->
  <rect x="380" y="462" width="110" height="20" rx="10" fill="#082f49" stroke="#0891b2" stroke-width="1"/>
  <text x="435" y="475" text-anchor="middle" fill="#22d3ee" font-size="10" font-weight="600">localhost:8000</text>

  <!-- ═══ GEMINI BOX ═══ -->
  <rect x="630" y="75" width="240" height="420" rx="12" fill="#1c1005" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
  <rect x="630" y="75" width="240" height="36" rx="12" fill="url(#geminiGrad)" opacity="0.9"/>
  <rect x="630" y="99" width="240" height="12" fill="url(#geminiGrad)" opacity="0.9"/>
  <text x="750" y="99" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">✦  Google Gemini API</text>
  <text x="750" y="112" text-anchor="middle" fill="#fde68a" font-size="9">ai.google.dev · Free Tier</text>

  <!-- Embedding model -->
  <rect x="648" y="125" width="204" height="70" rx="8" fill="#1c1005" stroke="#f59e0b" stroke-width="1"/>
  <text x="750" y="142" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">Embeddings Model</text>
  <text x="750" y="158" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="600">text-embedding-001</text>
  <text x="750" y="172" text-anchor="middle" fill="#64748b" font-size="8">768-dimensional vectors</text>
  <text x="750" y="184" text-anchor="middle" fill="#64748b" font-size="8">task: retrieval_document / retrieval_query</text>

  <!-- Generation model -->
  <rect x="648" y="207" width="204" height="70" rx="8" fill="#1c1005" stroke="#f59e0b" stroke-width="1"/>
  <text x="750" y="224" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">Generation Model</text>
  <text x="750" y="240" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="600">gemini-3.5-flash-lite</text>
  <text x="750" y="254" text-anchor="middle" fill="#64748b" font-size="8">High RPM free tier</text>
  <text x="750" y="266" text-anchor="middle" fill="#64748b" font-size="8">Configurable via GEMINI_MODEL env var</text>

  <!-- Use cases -->
  <rect x="648" y="290" width="204" height="160" rx="8" fill="#1c1005" stroke="#78350f" stroke-width="1"/>
  <text x="750" y="308" text-anchor="middle" fill="#f97316" font-size="10" font-weight="700">Prompts</text>
  <text x="658" y="326" fill="#92400e" font-size="8">►</text>
  <text x="668" y="326" fill="#94a3b8" font-size="8">Grounded Q&amp;A  — context-only answer</text>
  <text x="658" y="342" fill="#92400e" font-size="8">►</text>
  <text x="668" y="342" fill="#94a3b8" font-size="8">Interview Prep  — JSON 3-category output</text>
  <text x="658" y="358" fill="#92400e" font-size="8">►</text>
  <text x="668" y="358" fill="#94a3b8" font-size="8">Weak Spots  — gap analysis JSON</text>
  <text x="658" y="374" fill="#92400e" font-size="8">►</text>
  <text x="668" y="374" fill="#94a3b8" font-size="8">Coach Bot  — 10-turn history context</text>
  <text x="658" y="398" fill="#475569" font-size="7.5">Retry on 429 · exponential backoff</text>
  <text x="658" y="411" fill="#475569" font-size="7.5">2→4→8→16s wait between retries</text>
  <text x="658" y="424" fill="#475569" font-size="7.5">JSON extraction from markdown fences</text>
  <text x="658" y="440" fill="#475569" font-size="7.5">"not stated in this posting" fallback</text>

  <!-- API key pill -->
  <rect x="685" y="462" width="130" height="20" rx="10" fill="#1c1005" stroke="#f59e0b" stroke-width="1"/>
  <text x="750" y="475" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">GOOGLE_API_KEY</text>

  <!-- ═══ ARROWS ═══ -->
  <!-- Frontend → Backend request -->
  <path d="M 240 200 L 318 200" stroke="#60a5fa" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="279" y="195" text-anchor="middle" fill="#60a5fa" font-size="8">HTTP</text>

  <!-- Backend → Frontend response -->
  <path d="M 318 220 L 240 220" stroke="#a78bfa" stroke-width="1.8" fill="none" marker-end="url(#arrowPurple)" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="279" y="235" text-anchor="middle" fill="#a78bfa" font-size="8">JSON</text>

  <!-- Backend → Gemini embed -->
  <path d="M 550 180 L 628 180" stroke="#34d399" stroke-width="1.8" fill="none" marker-end="url(#arrowGreen)" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="589" y="175" text-anchor="middle" fill="#34d399" font-size="8">embed()</text>

  <!-- Gemini → Backend vectors -->
  <path d="M 628 195 L 550 195" stroke="#fbbf24" stroke-width="1.8" fill="none" marker-end="url(#arrowYellow)" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="589" y="210" text-anchor="middle" fill="#fbbf24" font-size="8">768-dim</text>

  <!-- Backend → Gemini generate -->
  <path d="M 550 255 L 628 255" stroke="#34d399" stroke-width="1.8" fill="none" marker-end="url(#arrowGreen)" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="589" y="250" text-anchor="middle" fill="#34d399" font-size="8">generate()</text>

  <!-- Gemini → Backend text -->
  <path d="M 628 270 L 550 270" stroke="#fbbf24" stroke-width="1.8" fill="none" marker-end="url(#arrowYellow)" stroke-dasharray="5,3">
    <animate attributeName="stroke-dashoffset" values="16;0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="589" y="285" text-anchor="middle" fill="#fbbf24" font-size="8">text</text>

  <!-- ═══ LEGEND ═══ -->
  <rect x="30" y="510" width="840" height="55" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="527" fill="#475569" font-size="9" font-weight="700">LEGEND</text>

  <line x1="110" y1="524" x2="145" y2="524" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="150" y="527" fill="#94a3b8" font-size="9">HTTP Request</text>

  <line x1="240" y1="524" x2="275" y2="524" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="280" y="527" fill="#94a3b8" font-size="9">JSON Response</text>

  <line x1="380" y1="524" x2="415" y2="524" stroke="#34d399" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="420" y="527" fill="#94a3b8" font-size="9">Gemini API Call</text>

  <line x1="520" y1="524" x2="555" y2="524" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="560" y="527" fill="#94a3b8" font-size="9">Gemini Response</text>

  <text x="50" y="551" fill="#475569" font-size="8.5">Vector Store: In-memory numpy float32 matrix · resets on each /api/ingest call · cosine similarity search</text>
  <text x="50" y="562" fill="#475569" font-size="8.5">Resume Parsing: PDF→PyPDF2 (server) · DOCX→DecompressionStream (browser) · TXT→FileReader (browser)</text>
</svg>
